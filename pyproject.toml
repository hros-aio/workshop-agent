[project]
name = "workshop-module"
version = "0.1.0"
description = "Workshop Module - AI-assisted HRMS implementation discovery workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "arq>=0.26",
    "pyjwt[crypto]>=2.10",
    "boto3>=1.35",
    "confluent-kafka>=2.6",
    "structlog>=24.4",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "openai>=1.55",
    "instructor>=1.7",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,minio]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-boto3>=1.35",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["arq.*", "confluent_kafka.*", "pdfplumber.*", "docx.*", "pytesseract.*", "instructor.*", "xlrd.*", "openpyxl.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring Docker (testcontainers)",
]
